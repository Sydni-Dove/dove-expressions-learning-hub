name: Verify learning hub
on:
  pull_request:
  push:
    branches: [codex/voice-persistent-coaching]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      # The existing lint script has no ESLint dependency in the application lockfile.
      - run: npm install --no-save --package-lock=false eslint@8.57.1 eslint-config-next@14.2.35
      - run: npm run lint
      - if: always()
        run: npm test
      - if: always()
        run: npm run test:sql
      - if: always()
        run: cp .env.local.example .env.local
      - if: always()
        run: npm run build
