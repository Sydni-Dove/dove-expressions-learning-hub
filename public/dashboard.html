<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Dove Expressions — Command Center</title>
<meta name="description" content="Dove Expressions founder operating system — from Revelation to Execution." />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=Lora:ital,wght@0,400;0,500;1,400&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.10/babel.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
  :root{
    --burgundy:#630000; --burgundy-soft:#7a1a1a; --burgundy-tint:#f4ebe9;
    --charcoal:#1B1717; --white:#FDFDFD;
    --sunrise:#D97904; --coral:#D96248; --pale-pink:#F2DFD8; --gold:#E6A742;
    --ink:#1B1717; --ink-mid:#4a3f3f; --ink-soft:#7a6a6a; --ink-faint:#a89a9a;
    --paper:#FBF8F6; --card:#FFFFFF; --line:#ece2dd; --line-strong:#e0d3cc;
    --shadow-sm:0 1px 2px rgba(27,23,23,.04), 0 1px 3px rgba(27,23,23,.05);
    --shadow-md:0 2px 8px rgba(27,23,23,.05), 0 8px 24px rgba(99,0,0,.04);
    --shadow-lg:0 12px 40px rgba(27,23,23,.10);
    --serif:'Playfair Display', Georgia, serif;
    --body:'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    --r:14px;
  }
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
  html,body{height:100%;}
  body{
    font-family:var(--body); color:var(--ink); background:var(--paper);
    -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
    font-size:14px; line-height:1.55;
  }
  #root{min-height:100%;}
  ::selection{background:var(--pale-pink);color:var(--burgundy);}
  .serif{font-family:var(--serif);}
  h1,h2,h3,h4{font-family:var(--serif);font-weight:600;line-height:1.15;letter-spacing:-.01em;color:var(--ink);}
  a{color:inherit;text-decoration:none;}
  button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;}
  input{font-family:inherit;}
  ::-webkit-scrollbar{width:10px;height:10px;}
  ::-webkit-scrollbar-thumb{background:#e6dad4;border-radius:20px;border:3px solid var(--paper);}
  ::-webkit-scrollbar-thumb:hover{background:#d9c8c0;}

  /* ---------- Layout shell ---------- */
  .app{display:grid;grid-template-columns:264px 1fr;min-height:100vh;}
  .sidebar{
    position:sticky;top:0;height:100vh;background:var(--charcoal);
    color:#efe6e2;display:flex;flex-direction:column;padding:22px 16px;overflow-y:auto;
  }
  .brandmark{display:flex;align-items:center;gap:11px;padding:4px 8px 20px;}
  .brand-glyph{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;
    background:linear-gradient(150deg,var(--burgundy),var(--coral));box-shadow:0 4px 14px rgba(217,98,72,.28);flex:none;}
  .brand-name{font-family:var(--serif);font-size:17px;color:#fff;letter-spacing:.01em;line-height:1.1;}
  .brand-sub{font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:#b9a59f;margin-top:2px;}
  .nav-group{margin-top:14px;}
  .nav-label{font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:#8c7a74;padding:0 10px;margin-bottom:6px;}
  .nav-item{display:flex;align-items:center;gap:11px;padding:8.5px 11px;border-radius:9px;
    color:#cdbfba;font-size:13.5px;font-weight:450;transition:.16s;position:relative;width:100%;text-align:left;}
  .nav-item:hover{background:rgba(255,255,255,.05);color:#fff;}
  .nav-item.active{background:rgba(217,98,72,.14);color:#fff;font-weight:550;}
  .nav-item.active::before{content:"";position:absolute;left:-16px;top:50%;transform:translateY(-50%);
    width:3px;height:20px;border-radius:0 3px 3px 0;background:var(--coral);}
  .nav-item .ico{opacity:.85;flex:none;}
  .nav-count{margin-left:auto;font-size:11px;color:#8c7a74;font-weight:500;font-family:var(--body);}
  .nav-item.active .nav-count{color:#e7c4b9;}
  .sidebar-foot{margin-top:auto;padding:18px 10px 4px;border-top:1px solid rgba(255,255,255,.08);}
  .sidebar-foot .fn{font-family:var(--serif);font-size:14px;color:#fff;}
  .sidebar-foot .fs{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:#9a8781;margin-top:3px;}

  .main{display:flex;flex-direction:column;min-width:0;}
  .topbar{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:16px;
    padding:14px 34px;background:rgba(251,248,246,.82);backdrop-filter:saturate(1.4) blur(12px);
    border-bottom:1px solid var(--line);}
  .search{flex:1;max-width:520px;position:relative;}
  .search input{width:100%;padding:10px 14px 10px 40px;border:1px solid var(--line-strong);border-radius:11px;
    background:var(--card);font-size:13.5px;color:var(--ink);transition:.16s;}
  .search input:focus{outline:none;border-color:var(--coral);box-shadow:0 0 0 3px rgba(217,98,72,.12);}
  .search .si{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:var(--ink-faint);}
  .search-pop{position:absolute;top:calc(100% + 8px);left:0;right:0;background:var(--card);
    border:1px solid var(--line);border-radius:13px;box-shadow:var(--shadow-lg);max-height:420px;overflow-y:auto;padding:8px;z-index:60;}
  .sr-group{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-faint);padding:9px 10px 4px;}
  .sr{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:9px;width:100%;text-align:left;transition:.12s;}
  .sr:hover{background:var(--burgundy-tint);}
  .sr-name{font-size:13px;font-weight:500;color:var(--ink);}
  .sr-meta{font-size:11px;color:var(--ink-soft);}
  .btn{display:inline-flex;align-items:center;gap:7px;padding:9px 15px;border-radius:10px;font-size:13px;font-weight:550;transition:.16s;white-space:nowrap;}
  .btn-primary{background:var(--burgundy);color:#fff;box-shadow:0 3px 10px rgba(99,0,0,.18);}
  .btn-primary:hover{background:var(--burgundy-soft);transform:translateY(-1px);}
  .btn-ghost{border:1px solid var(--line-strong);background:var(--card);color:var(--ink-mid);}
  .btn-ghost:hover{border-color:var(--coral);color:var(--burgundy);}
  .avatar{width:38px;height:38px;border-radius:50%;background:linear-gradient(150deg,var(--burgundy),var(--sunrise));
    color:#fff;display:grid;place-items:center;font-weight:600;font-size:14px;flex:none;box-shadow:var(--shadow-sm);}

  .page{padding:34px 34px 80px;max-width:1320px;width:100%;margin:0 auto;}
  .page-head{margin-bottom:26px;}
  .eyebrow{font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--coral);font-weight:600;margin-bottom:9px;}
  .page-title{font-size:34px;letter-spacing:-.02em;}
  .page-desc{color:var(--ink-soft);font-size:14.5px;margin-top:8px;max-width:640px;}

  /* ---------- Cards & primitives ---------- */
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow-sm);transition:.18s;}
  .card:hover{box-shadow:var(--shadow-md);border-color:var(--line-strong);}
  .clickable{cursor:pointer;}
  .clickable:hover{transform:translateY(-2px);}
  .badge{display:inline-flex;align-items:center;gap:5px;padding:3.5px 10px;border-radius:100px;
    font-size:11px;font-weight:600;letter-spacing:.02em;line-height:1.4;white-space:nowrap;}
  .badge .dot{width:6px;height:6px;border-radius:50%;background:currentColor;flex:none;}
  .prio{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;letter-spacing:.03em;}
  .prio .bars{display:inline-flex;gap:2px;align-items:flex-end;height:11px;}
  .prio .bars i{width:3px;border-radius:2px;background:currentColor;opacity:.28;}
  .prio.high{color:var(--coral);} .prio.medium{color:var(--gold);} .prio.low{color:var(--ink-faint);}
  .chip{display:inline-flex;align-items:center;gap:6px;padding:4px 11px;border-radius:100px;font-size:11.5px;font-weight:500;
    border:1px solid var(--line-strong);color:var(--ink-mid);background:var(--card);transition:.14s;white-space:nowrap;}
  .chip.on{background:var(--burgundy);color:#fff;border-color:var(--burgundy);}
  .chip.click{cursor:pointer;} .chip.click:hover{border-color:var(--coral);}
  .pillar-tag{font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;font-weight:600;color:var(--burgundy);}
  .loc{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--ink-soft);
    font-family:ui-monospace,SFMono-Regular,Menlo,monospace;background:var(--burgundy-tint);
    padding:4px 9px;border-radius:7px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .divider{height:1px;background:var(--line);margin:0;}
  .muted{color:var(--ink-soft);} .faint{color:var(--ink-faint);}
  .kv{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-faint);font-weight:600;}

  /* Section titles */
  .sec{margin:38px 0 16px;display:flex;align-items:baseline;justify-content:space-between;gap:14px;flex-wrap:wrap;}
  .sec h2{font-size:22px;}
  .sec .sub{color:var(--ink-soft);font-size:13px;}
  .sec-eyebrow{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--coral);font-weight:600;}

  /* Grids */
  .grid{display:grid;gap:18px;}
  .g-metrics{grid-template-columns:repeat(4,1fr);}
  .g-cards{grid-template-columns:repeat(3,1fr);}
  .g-2{grid-template-columns:repeat(2,1fr);}
  .g-apps{grid-template-columns:repeat(2,1fr);}

  /* Metric card */
  .metric{padding:18px 18px 16px;display:flex;flex-direction:column;gap:2px;position:relative;overflow:hidden;}
  .metric .mi{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;margin-bottom:12px;background:var(--burgundy-tint);color:var(--burgundy);}
  .metric .mv{font-family:var(--serif);font-size:32px;font-weight:600;line-height:1;color:var(--ink);}
  .metric .ml{font-size:12.5px;color:var(--ink-soft);margin-top:6px;font-weight:500;}
  .metric .mx{font-size:11px;color:var(--ink-faint);margin-top:2px;}

  /* Hero */
  .hero{position:relative;overflow:hidden;border-radius:20px;padding:40px 40px;color:#fff;
    background:linear-gradient(120deg,#4a0000 0%,#630000 42%,#7a1a1a 100%);box-shadow:var(--shadow-lg);}
  .hero::after{content:"";position:absolute;right:-60px;top:-60px;width:320px;height:320px;border-radius:50%;
    background:radial-gradient(circle at 30% 30%,rgba(217,121,4,.42),rgba(217,98,72,.05) 70%);pointer-events:none;}
  .hero::before{content:"";position:absolute;left:-40px;bottom:-90px;width:260px;height:260px;border-radius:50%;
    background:radial-gradient(circle,rgba(242,223,216,.14),transparent 70%);pointer-events:none;}
  .hero .eb{font-size:11px;letter-spacing:.24em;text-transform:uppercase;color:#f0c9ba;font-weight:600;}
  .hero h1{color:#fff;font-size:40px;margin:12px 0 0;letter-spacing:-.02em;}
  .hero .tag{font-family:var(--serif);font-style:italic;font-size:19px;color:#f2d9d0;margin-top:6px;}
  .hero .mission{max-width:560px;margin-top:20px;color:#f0e2dd;font-size:14px;line-height:1.6;position:relative;z-index:1;}
  .hero .mission b{color:#fff;font-weight:600;}

  /* Current focus */
  .focus-flow{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
  .flow-node{padding:8px 14px;border-radius:10px;background:var(--burgundy-tint);color:var(--burgundy);
    font-weight:600;font-size:13px;border:1px solid #eeddd6;}
  .flow-arrow{color:var(--gold);}
  .flow-node.exec{background:#fbf1e3;color:var(--sunrise);border-color:#f3e2c8;}
  .pillars{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;}
  .pillar{position:relative;padding:20px 18px;border-radius:13px;border:1px solid var(--line);background:var(--card);overflow:hidden;}
  .pillar .num{font-family:var(--serif);font-size:15px;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;
    background:var(--burgundy);color:#fff;margin-bottom:12px;}
  .pillar h4{font-size:16px;} .pillar p{font-size:12.5px;color:var(--ink-soft);margin-top:6px;}
  .pillar-arrow{position:absolute;right:-11px;top:50%;transform:translateY(-50%);z-index:2;color:var(--gold);
    background:var(--card);border-radius:50%;padding:2px;}

  /* Roadmap */
  .road{display:flex;gap:0;overflow-x:auto;padding:6px 2px 12px;}
  .road-stage{flex:1;min-width:150px;position:relative;padding:0 8px;}
  .road-stage .line{position:absolute;top:15px;left:50%;right:-50%;height:2px;background:var(--line-strong);z-index:0;}
  .road-stage:last-child .line{display:none;}
  .road-stage .node{position:relative;z-index:1;width:32px;height:32px;border-radius:50%;display:grid;place-items:center;
    background:var(--card);border:2px solid var(--line-strong);color:var(--ink-faint);font-weight:600;font-size:13px;font-family:var(--serif);margin:0 auto;}
  .road-stage.complete .node{background:var(--burgundy);border-color:var(--burgundy);color:#fff;}
  .road-stage.active .node{background:var(--sunrise);border-color:var(--sunrise);color:#fff;box-shadow:0 0 0 5px rgba(217,121,4,.16);}
  .road-stage.active .line,.road-stage.complete .line{background:var(--burgundy);}
  .road-stage .rt{text-align:center;margin-top:12px;font-size:12.5px;font-weight:550;color:var(--ink-mid);}
  .road-stage.active .rt{color:var(--sunrise);}
  .road-stage .rs{text-align:center;margin-top:4px;font-size:10.5px;color:var(--ink-faint);}

  /* Project card */
  .proj{padding:20px;display:flex;flex-direction:column;gap:0;height:100%;}
  .proj .top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;}
  .proj h3{font-size:18px;} .proj h4{font-size:16px;}
  .proj .cat{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-faint);font-weight:600;margin-bottom:7px;}
  .proj .desc{font-size:13px;color:var(--ink-mid);margin:12px 0 14px;line-height:1.55;}
  .proj .meta-row{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;margin-top:auto;}
  .next-action{display:flex;gap:9px;align-items:flex-start;padding:11px 13px;border-radius:10px;background:#fbf6ee;border:1px solid #f2e6d2;margin-top:14px;}
  .next-action .na-l{font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--sunrise);font-weight:700;}
  .next-action .na-t{font-size:12.5px;color:var(--ink-mid);font-weight:500;margin-top:2px;}
  .progress{height:6px;border-radius:100px;background:var(--line);overflow:hidden;margin-top:14px;}
  .progress i{display:block;height:100%;border-radius:100px;background:linear-gradient(90deg,var(--burgundy),var(--coral));}

  /* App big card */
  .appcard{padding:24px;display:flex;flex-direction:column;height:100%;}
  .appcard .head{display:flex;gap:15px;align-items:flex-start;}
  .appcard .glyph{width:52px;height:52px;border-radius:14px;display:grid;place-items:center;flex:none;
    background:linear-gradient(150deg,var(--burgundy),var(--coral));color:#fff;box-shadow:0 6px 16px rgba(99,0,0,.2);}
  .appcard .specs{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line);border:1px solid var(--line);
    border-radius:11px;overflow:hidden;margin-top:18px;}
  .appcard .spec{background:var(--card);padding:12px 14px;}
  .appcard .spec .k{font-size:9.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--ink-faint);font-weight:700;}
  .appcard .spec .v{font-size:13px;color:var(--ink);margin-top:4px;font-weight:500;}
  .stack{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px;}
  .stack span{font-size:11px;padding:2px 8px;border-radius:6px;background:var(--burgundy-tint);color:var(--burgundy-soft);font-weight:500;}

  /* Table */
  .tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--card);box-shadow:var(--shadow-sm);}
  table{width:100%;border-collapse:collapse;font-size:13px;min-width:720px;}
  th{text-align:left;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-faint);
    font-weight:700;padding:13px 16px;border-bottom:1px solid var(--line);background:#fdfaf8;position:sticky;top:0;}
  td{padding:13px 16px;border-bottom:1px solid var(--line);color:var(--ink-mid);vertical-align:middle;}
  tr:last-child td{border-bottom:none;}
  tbody tr{transition:.12s;cursor:pointer;}
  tbody tr:hover{background:var(--burgundy-tint);}
  td .tn{font-weight:600;color:var(--ink);}

  /* Toolbar (filters) */
  .toolbar{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center;margin-bottom:22px;
    padding:14px 16px;background:var(--card);border:1px solid var(--line);border-radius:13px;box-shadow:var(--shadow-sm);}
  .filter-group{display:flex;gap:6px;align-items:center;flex-wrap:wrap;}
  .filter-group .fl{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-faint);font-weight:700;margin-right:2px;}
  .view-toggle{margin-left:auto;display:flex;background:var(--burgundy-tint);border-radius:9px;padding:3px;}
  .view-toggle button{padding:6px 12px;border-radius:7px;font-size:12px;font-weight:600;color:var(--ink-soft);display:flex;align-items:center;gap:6px;}
  .view-toggle button.on{background:var(--card);color:var(--burgundy);box-shadow:var(--shadow-sm);}

  /* Ideas vault */
  .vault-col{background:linear-gradient(180deg,rgba(242,223,216,.28),transparent 120px);border:1px solid var(--line);border-radius:14px;padding:14px;}
  .vault-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;padding:2px 4px;}
  .vault-head .vt{font-family:var(--serif);font-size:16px;}
  .vault-head .vc{font-size:11px;color:var(--ink-faint);background:var(--card);border:1px solid var(--line);border-radius:100px;padding:2px 9px;font-weight:600;}
  .idea{padding:14px;border-radius:11px;background:var(--card);border:1px solid var(--line);margin-bottom:10px;transition:.16s;cursor:pointer;}
  .idea:hover{box-shadow:var(--shadow-md);transform:translateY(-2px);border-color:var(--line-strong);}
  .idea:last-child{margin-bottom:0;}
  .idea .in{font-size:14px;font-weight:600;color:var(--ink);}
  .idea .ic{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--coral);font-weight:600;margin-top:2px;}
  .idea .id{font-size:12px;color:var(--ink-soft);margin-top:8px;line-height:1.5;}
  .idea .istep{font-size:11.5px;color:var(--ink-mid);margin-top:10px;display:flex;gap:6px;}
  .promote{margin-top:11px;font-size:11px;font-weight:600;color:var(--burgundy);display:inline-flex;align-items:center;gap:5px;
    padding:5px 10px;border:1px solid var(--line-strong);border-radius:8px;transition:.14s;}
  .promote:hover{background:var(--burgundy);color:#fff;border-color:var(--burgundy);}

  /* Series */
  .series{border:1px solid var(--line);border-radius:var(--r);background:var(--card);overflow:hidden;box-shadow:var(--shadow-sm);}
  .series .sh{padding:20px 22px;background:linear-gradient(120deg,var(--burgundy),#7a1a1a);color:#fff;position:relative;overflow:hidden;}
  .series .sh::after{content:"";position:absolute;right:-30px;top:-30px;width:160px;height:160px;border-radius:50%;background:radial-gradient(circle,rgba(217,121,4,.4),transparent 70%);}
  .series .sh h3{color:#fff;font-size:20px;position:relative;}
  .series .sh .sp{position:relative;margin-top:14px;}
  .ep{display:flex;align-items:center;gap:14px;padding:14px 22px;border-bottom:1px solid var(--line);transition:.12s;cursor:pointer;}
  .ep:hover{background:var(--burgundy-tint);}
  .ep:last-child{border-bottom:none;}
  .ep .epn{width:30px;height:30px;border-radius:50%;flex:none;display:grid;place-items:center;font-family:var(--serif);
    font-size:13px;background:var(--burgundy-tint);color:var(--burgundy);font-weight:600;}
  .ep .ept{font-size:13.5px;font-weight:550;color:var(--ink);}

  /* Brand kit */
  .swatches{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:14px;}
  .swatch{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--card);box-shadow:var(--shadow-sm);transition:.16s;cursor:pointer;}
  .swatch:hover{box-shadow:var(--shadow-md);transform:translateY(-2px);}
  .swatch .chip-c{height:78px;}
  .swatch .info{padding:11px 13px;}
  .swatch .sn{font-size:13px;font-weight:600;}

// DB row -> in-app record shape used by the components
function rowToItem(r){
  return {
    id:r.id, kind:r.kind, type:(r.kind==="content_idea"?"video":r.kind),
    name:r.name, category:r.category, status:r.status, priority:r.priority, pillar:r.pillar, tier:r.tier,
    description:r.description, location:r.location, next:r.next_action, notes:r.notes,
    format:r.format, platform:r.platform, ptype:r.ptype, dtype:r.dtype, group:r.grp,
    bucket:r.bucket, maturity:r.maturity, performance:r.performance, build:r.build, source:r.source,
    progress:r.progress, stack:r.stack||[], related:r.related||[], episodes:r.episodes||[],
    thumb:r.thumb, updated:r.updated, sort:r.sort,
  };
}
function hydrate(rows){
  const byKind=k=>rows.filter(r=>r.kind===k).sort((a,b)=>(a.sort||0)-(b.sort||0)).map(rowToItem);
  apps=byKind("app"); products=byKind("product"); videosPublished=byKind("video");
  videoSeries=byKind("series"); contentIdeas=byKind("content_idea"); ideas=byKind("idea");
  communities=byKind("community"); courses=byKind("course"); documents=byKind("document"); designs=byKind("design");
}

// in-app record -> DB row (inverse of rowToItem). Only known columns are sent.
function itemToRow(it){
  const clean=v=>v===undefined?null:v;
  return {
    id:it.id, kind:it.kind, name:it.name, category:clean(it.category), status:clean(it.status),
    priority:clean(it.priority), pillar:clean(it.pillar), tier:clean(it.tier), description:clean(it.description),
    location:clean(it.location), next_action:clean(it.next), notes:clean(it.notes), format:clean(it.format),
    platform:clean(it.platform), ptype:clean(it.ptype), dtype:clean(it.dtype), grp:clean(it.group),
    bucket:clean(it.bucket), maturity:clean(it.maturity), performance:clean(it.performance), build:clean(it.build),
    source:clean(it.source), progress:(it.progress===""||it.progress==null?null:Number(it.progress)),
    stack:it.stack||[], related:it.related||[], episodes:it.episodes||[], thumb:clean(it.thumb),
    sort:(it.sort==null?0:it.sort), updated:it.updated||new Date().toISOString().slice(0,10),
  };
}
// CRUD — all resolve to {error} and are no-ops if the client is unavailable.
async function dbUpsert(it){ const c=getClient(); if(!c) return {error:{message:"offline"}};
  return await c.from("dash_items").upsert(itemToRow(it)); }
async function dbDelete(id){ const c=getClient(); if(!c) return {error:{message:"offline"}};
  return await c.from("dash_items").delete().eq("id",id); }
// derive the array a given kind lives in, to compute next sort + a fresh id
function kindArray(kind){
  return ({app:apps,product:products,video:videosPublished,series:videoSeries,content_idea:contentIdeas,
    idea:ideas,community:communities,course:courses,document:documents,design:designs})[kind]||[];
}
function nextSort(kind){ const a=kindArray(kind); return a.length?Math.max(...a.map(x=>x.sort||0))+1:0; }
function freshId(kind){ return kind+"-"+Math.random().toString(36).slice(2,8)+Date.now().toString(36).slice(-4); }

function search(q){
  q=q.trim().toLowerCase(); if(!q) return [];
  return allItems().filter(i=>(
    (i.name||"").toLowerCase().includes(q) ||
    (i.description||"").toLowerCase().includes(q) ||
    (i.category||"").toLowerCase().includes(q) ||
    (i.location||"").toLowerCase().includes(q) ||
    (i.ptype||"").toLowerCase().includes(q) ||
    (i.dtype||"").toLowerCase().includes(q)
  )).slice(0,12);
}

/* ---- Passphrase gate (signs in behind the scenes as the owner) ---- */
function LockGate({onUnlock}){
  const [pass,setPass]=useState("");
  const [err,setErr]=useState("");
  const [busy,setBusy]=useState(false);
  const submit=async(e)=>{
    e.preventDefault(); setErr(""); setBusy(true);
    const msg=await onUnlock(pass);
    if(msg){ setErr(msg); setBusy(false); }
  };
  return (
    <div className="gate">
      <div className="gate-card">
        <div className="brand-glyph" style={{width:52,height:52,borderRadius:15,margin:"0 auto 20px"}}>
          <span style={{fontFamily:"var(--serif)",fontStyle:"italic",fontWeight:600,fontSize:"30px",color:"#fff"}}>D</span>
        </div>
        <div className="eyebrow" style={{textAlign:"center"}}>Dove Expressions</div>
        <h1 style={{fontSize:30,textAlign:"center",marginTop:6}}>Command Center</h1>
        <p className="muted" style={{textAlign:"center",fontSize:13,margin:"10px 0 22px"}}>Enter your passphrase to continue.</p>
        <form onSubmit={submit}>
          <input className="fin" type="password" placeholder="Passphrase" value={pass}
            onChange={e=>setPass(e.target.value)} autoFocus style={{textAlign:"center",letterSpacing:".08em",marginBottom:12}}/>
          {err && <div style={{color:"var(--coral)",fontSize:12.5,textAlign:"center",margin:"0 0 10px"}}>{err}</div>}
          <button className="btn btn-primary" type="submit" disabled={busy}
            style={{width:"100%",justifyContent:"center"}}>{busy?"Unlocking…":"Unlock"}</button>
        </form>
        <div style={{textAlign:"center",fontSize:11,color:"var(--ink-faint)",marginTop:16,letterSpacing:".12em",textTransform:"uppercase"}}>From Revelation to Execution</div>
      </div>
    </div>
  );
}

function FormModal({mode,item,onClose,onSaved}){
  const init = item || {kind:"idea",status:"planned",priority:"medium",tier:"next"};
  const [f,setF]=useState({...init,
    stackStr:(init.stack||[]).join(", "), relatedStr:(init.related||[]).join(", ")});
  const [busy,setBusy]=useState(false);
  const [err,setErr]=useState("");
  useEffect(()=>{ const h=(e)=>{if(e.key==="Escape")onClose();}; window.addEventListener("keydown",h); return ()=>window.removeEventListener("keydown",h); },[]);
  const set=(k,v)=>setF(s=>({...s,[k]:v}));
  const save=async(e)=>{
    e.preventDefault(); if(!f.name){ setErr("Name is required."); return; }
    setBusy(true); setErr("");
    const rec={...f,
      id:f.id||freshId(f.kind), sort:(f.sort==null?nextSort(f.kind):f.sort),
      stack:f.stackStr.split(",").map(s=>s.trim()).filter(Boolean),
      related:f.relatedStr.split(",").map(s=>s.trim()).filter(Boolean),
      episodes:f.episodes||[],
    };
    const {error}=await dbUpsert(rec);
    if(error){ setErr(error.message||"Save failed."); setBusy(false); return; }
    await onSaved();
  };
  const k=f.kind;
  return (
    <React.Fragment>
      <div className="scrim" onClick={onClose}/>
      <div className="formwrap">
        <div className="card" style={{display:"flex",flexDirection:"column",maxHeight:"86vh"}}>
          <div className="dh" style={{padding:"20px 24px 16px",borderBottom:"1px solid var(--line)",position:"relative"}}>
            <button className="close" onClick={onClose} style={{top:16,right:18}}><Icon name="x" size={18} sw={2}/></button>
            <div className="sec-eyebrow">{mode==="edit"?"Edit":"Add new"}</div>
            <h2 style={{fontSize:23,marginTop:4,paddingRight:30}}>{mode==="edit"?(f.name||"Item"):"New item"}</h2>
          </div>
          <form onSubmit={save} style={{padding:"20px 24px",overflowY:"auto"}}>
            <Field label="Name"><input className="fin" value={f.name||""} onChange={e=>set("name",e.target.value)} autoFocus/></Field>
            <div className="fgrid">
              <Field label="Type"><Sel value={f.kind} onChange={v=>set("kind",v||"idea")} opts={KIND_OPTS} blank={false}/></Field>
              <Field label="Category"><input className="fin" value={f.category||""} onChange={e=>set("category",e.target.value)}/></Field>
            </div>
            <div className="fgrid">
              <Field label="Status"><Sel value={f.status} onChange={v=>set("status",v)} opts={STATUS_OPTS}/></Field>
              <Field label="Priority"><Sel value={f.priority} onChange={v=>set("priority",v)} opts={[["high","High"],["medium","Medium"],["low","Low"]]}/></Field>
            </div>
            <div className="fgrid">
              <Field label="Pillar"><Sel value={f.pillar} onChange={v=>set("pillar",v)} opts={[["draw","Draw Near"],["hear","Hear God"],["fulfill","Fulfill Mandate"]]}/></Field>
              <Field label="Tier"><Sel value={f.tier} onChange={v=>set("tier",v)} opts={[["now","NOW"],["next","NEXT"],["later","LATER"],["vault","VAULT"]]}/></Field>
            </div>
            {(k==="product") && <div className="fgrid">
              <Field label="Product type"><input className="fin" value={f.ptype||""} onChange={e=>set("ptype",e.target.value)}/></Field>
              <Field label="Format"><input className="fin" value={f.format||""} onChange={e=>set("format",e.target.value)}/></Field></div>}
            {(k==="video"||k==="content_idea") && <div className="fgrid">
              <Field label="Platform"><input className="fin" value={f.platform||""} onChange={e=>set("platform",e.target.value)}/></Field>
              <Field label="Performance"><input className="fin" value={f.performance||""} onChange={e=>set("performance",e.target.value)}/></Field></div>}
            {k==="idea" && <div className="fgrid">
              <Field label="Vault bucket"><Sel value={f.bucket} onChange={v=>set("bucket",v)} opts={IDEA_BUCKETS.map(b=>[b.key,b.label])}/></Field>
              <Field label="Source / context"><input className="fin" value={f.source||""} onChange={e=>set("source",e.target.value)}/></Field></div>}
            {k==="community" && <Field label="Maturity"><Sel value={f.maturity} onChange={v=>set("maturity",v)} opts={MATURITY.map(m=>[m,MATURITY_LABEL[m]])}/></Field>}
            {k==="course" && <Field label="Group"><Sel value={f.group} onChange={v=>set("group",v)} opts={COURSE_GROUPS.map(g=>[g,g])}/></Field>}
            {k==="document" && <div className="fgrid">
              <Field label="Doc type"><input className="fin" value={f.dtype||""} onChange={e=>set("dtype",e.target.value)}/></Field>
              <Field label="Group"><Sel value={f.group} onChange={v=>set("group",v)} opts={DOC_GROUPS.map(g=>[g,DOC_GROUP_LABEL[g]])}/></Field></div>}
            {k==="design" && <div className="fgrid">
              <Field label="Asset type"><input className="fin" value={f.dtype||""} onChange={e=>set("dtype",e.target.value)}/></Field>
              <Field label="Thumbnail path"><input className="fin" value={f.thumb||""} onChange={e=>set("thumb",e.target.value)}/></Field></div>}
            {k==="app" && <div className="fgrid">
              <Field label="Current build"><input className="fin" value={f.build||""} onChange={e=>set("build",e.target.value)}/></Field>
              <Field label="Progress %"><input className="fin" type="number" min="0" max="100" value={f.progress==null?"":f.progress} onChange={e=>set("progress",e.target.value)}/></Field></div>}
            <Field label="Location"><input className="fin" value={f.location||""} onChange={e=>set("location",e.target.value)} placeholder="Where this lives"/></Field>
            <Field label="Next action"><input className="fin" value={f.next||""} onChange={e=>set("next",e.target.value)}/></Field>
            <Field label="Description"><textarea className="fin" rows={3} value={f.description||""} onChange={e=>set("description",e.target.value)}/></Field>
            <Field label="Notes"><textarea className="fin" rows={2} value={f.notes||""} onChange={e=>set("notes",e.target.value)}/></Field>
            {k==="app" && <Field label="Tech stack (comma-separated)"><input className="fin" value={f.stackStr} onChange={e=>set("stackStr",e.target.value)}/></Field>}
            <Field label="Related (comma-separated)"><input className="fin" value={f.relatedStr} onChange={e=>set("relatedStr",e.target.value)}/></Field>
            {err && <div style={{color:"var(--coral)",fontSize:12.5,margin:"2px 0 10px"}}>{err}</div>}
            <div style={{display:"flex",gap:10,marginTop:8}}>
              <button className="btn btn-primary" type="submit" disabled={busy} style={{flex:1,justifyContent:"center"}}>
                {busy?"Saving…":(mode==="edit"?"Save changes":"Create item")}</button>
              <button className="btn btn-ghost" type="button" onClick={onClose}>Cancel</button>
            </div>
          </form>
        </div>
      </div>
    </React.Fragment>
  );
}

function App(){
  const [pageKey,setPageKey]=useState("overview");
  const [drawer,setDrawer]=useState(null);
  const [q,setQ]=useState("");
  const [showSearch,setShowSearch]=useState(false);
  const [menu,setMenu]=useState(false);
  const [form,setForm]=useState(null);            // {mode:'create'|'edit', item} | null
  const [dataMode,setDataMode]=useState("sample"); // sample | live
  const [ver,setVer]=useState(0);                  // bump forces re-render after hydrate
  const [locked,setLocked]=useState(true);
  const [checking,setChecking]=useState(true);     // resolving existing session
  const searchRef=useRef();

  const go=(k)=>{setPageKey(k);setMenu(false);window.scrollTo(0,0);};
  const onOpen=(item)=>setDrawer(item);
  const results=useMemo(()=>search(q),[q,ver]);
  const grouped=useMemo(()=>{
    const g={}; results.forEach(r=>{(g[r.type]=g[r.type]||[]).push(r);}); return g;
  },[results]);

  // Load the owner's live inventory (requires an active session).
  const loadData=React.useCallback(async()=>{
    const c=getClient(); if(!c){ setDataMode("sample"); return; }
    try{
      const {data,error}=await c.from("dash_items").select("*");
      if(!error && data && data.length){ hydrate(data); setDataMode("live"); setVer(v=>v+1); }
      else { setDataMode("sample"); setVer(v=>v+1); }
    }catch(e){ setDataMode("sample"); }
  },[]);

  // On mount: if a session already exists, unlock silently and load.
  useEffect(()=>{ (async()=>{
    const c=getClient();
    if(!c){ setChecking(false); return; }           // no client → gate stays; unlock will report offline
    try{
      const {data:{session}}=await c.auth.getSession();
      if(session){ setLocked(false); await loadData(); }
    }catch(e){}
    setChecking(false);
  })(); },[loadData]);

  const unlock=async(pass)=>{
    const c=getClient();
    if(!c) return "Live data is unavailable in this environment.";
    try{
      const {error}=await c.auth.signInWithPassword({email:DASH_EMAIL,password:pass});
      if(error) return "That passphrase didn’t work. Try again.";
      setLocked(false); await loadData(); return "";
    }catch(e){ return "Something went wrong. Try again."; }
  };
  const lock=async()=>{ const c=getClient(); if(c){ try{ await c.auth.signOut(); }catch(e){} } setLocked(true); };

  const saveItem=async()=>{ await loadData(); setForm(null); };
  const deleteItem=async(it)=>{
    if(!window.confirm("Delete “"+it.name+"”? This cannot be undone.")) return;
    await dbDelete(it.id); setDrawer(null); await loadData();
  };

  useEffect(()=>{
    const h=(e)=>{ if(searchRef.current && !searchRef.current.contains(e.target)) setShowSearch(false); };
    document.addEventListener("mousedown",h); return ()=>document.removeEventListener("mousedown",h);
  },[]);

  const pfacets={
    products:[
      {key:"ptype",label:"Type",options:["Journal","Devotional","Workbook","Planner","Lead Magnet","Wall Art","Guide","Challenge"].map(v=>({value:v,label:v}))},
      {key:"pillar",label:"Pillar",options:Object.entries(PILLARS).map(([k,v])=>({value:k,label:v.short}))},
      {key:"status",label:"Status",options:[{value:"published",label:"Published"},{value:"existing",label:"Existing"},{value:"progress",label:"In Progress"},{value:"planned",label:"Planned"},{value:"someday",label:"Parked"}]},
      {key:"priority",label:"Priority",options:[{value:"high",label:"High"},{value:"medium",label:"Medium"},{value:"low",label:"Low"}]},
    ],
  };

  let page;
  if(pageKey==="overview") page=<Overview onOpen={onOpen} go={go}/>;
  else if(pageKey==="apps") page=<AppsPage onOpen={onOpen}/>;
  else if(pageKey==="products") page=<ListPage eyebrow="Build" title="Products & Journals" showProgress
      desc="A product studio view — journals, devotionals, workbooks and more, each mapped to a pillar and a next step."
      items={products} facets={pfacets.products} onOpen={onOpen}/>;
  else if(pageKey==="courses") page=<CoursesPage onOpen={onOpen}/>;
  else if(pageKey==="videos") page=<VideosPage onOpen={onOpen}/>;
  else if(pageKey==="ideas") page=<IdeasPage onOpen={onOpen}/>;
  else if(pageKey==="communities") page=<CommunitiesPage onOpen={onOpen}/>;
  else if(pageKey==="documents") page=<DocumentsPage onOpen={onOpen}/>;
  else if(pageKey==="designs") page=<DesignsPage onOpen={onOpen}/>;

  if(checking) return <div className="gate"><div className="gate-card" style={{textAlign:"center"}}><div className="muted">Loading…</div></div></div>;
  if(locked) return <LockGate onUnlock={unlock}/>;

  return (
    <div className="app">
      {menu && <div className="mobile-scrim" onClick={()=>setMenu(false)}/>}
      {/* SIDEBAR */}
      <nav className={"sidebar"+(menu?" open":"")}>
        <div className="brandmark">
          <div className="brand-glyph">
            <span style={{fontFamily:"var(--serif)",fontStyle:"italic",fontWeight:600,fontSize:"22px",color:"#fff",lineHeight:1}}>D</span>
          </div>
          <div><div className="brand-name">Dove Expressions</div><div className="brand-sub">Command Center</div></div>
        </div>
        {NAV.map((sec,i)=>(
          <div className="nav-group" key={i}>
            {sec.group && <div className="nav-label">{sec.group}</div>}
            {sec.items.map(it=>(
              <button key={it.key} className={"nav-item"+(pageKey===it.key?" active":"")} onClick={()=>go(it.key)}>
                <Icon name={it.icon} size={17}/>{it.label}
                {typeof it.count==="function" && <span className="nav-count">{it.count()}</span>}
              </button>
            ))}
          </div>
        ))}
        <div className="sidebar-foot">
          <div className="fn">Dove Expressions</div>
          <div className="fs">From Revelation to Execution</div>
        </div>
      </nav>

      {/* MAIN */}
      <div className="main">
        <header className="topbar">
          <button className="menu-btn" onClick={()=>setMenu(true)} aria-label="Menu"><Icon name="menu" size={20}/></button>
          <div className="search" ref={searchRef}>
            <span className="si"><Icon name="search" size={17}/></span>
            <input placeholder="Search apps, products, videos, ideas, documents…"
              value={q} onChange={e=>{setQ(e.target.value);setShowSearch(true);}} onFocus={()=>setShowSearch(true)}/>
            {showSearch && q.trim() &&
              <div className="search-pop">
                {results.length===0
                  ? <div style={{padding:"16px",color:"var(--ink-faint)",fontSize:13}}>No matches for “{q}”.</div>
                  : Object.entries(grouped).map(([type,list])=>(
                    <div key={type}>
                      <div className="sr-group">{TYPE_LABEL[type]||type}</div>
                      {list.map(r=>(
                        <button className="sr" key={r.id} onClick={()=>{onOpen(r);setShowSearch(false);}}>
                          <span style={{color:"var(--burgundy)",opacity:.7}}><Icon name="search" size={14}/></span>
                          <span style={{flex:1}}><span className="sr-name">{r.name}</span>
                            <span className="sr-meta" style={{display:"block"}}>{r.location||r.category||""}</span></span>
                          <Badge status={r.status}/>
                        </button>
                      ))}
                    </div>
                  ))}
              </div>}
          </div>
          <SyncPill mode={dataMode} onLock={lock}/>
          <button className="btn btn-primary" onClick={()=>setForm({mode:"create",item:null})}><Icon name="plus" size={16} sw={2.2}/><span className="btn-txt">Add New</span></button>
          <div className="avatar" title="Sydni Howard">SH</div>
        </header>
        {page}
      </div>

      {drawer && <Drawer item={drawer} onClose={()=>setDrawer(null)}
        canEdit={dataMode==="live"} onEdit={(it)=>{setDrawer(null);setForm({mode:"edit",item:it});}} onDelete={deleteItem}/>}
      {form && <FormModal mode={form.mode} item={form.item} onClose={()=>setForm(null)} onSaved={saveItem}/>}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
