# Disposable local Supabase-compatible stack for authenticated testing. No cloud project, branch or cost involved.
# Start: node testing/local-supabase/run.mjs up   Stop and delete everything: node testing/local-supabase/run.mjs down
name: dove-local
services:
  db:
    image: supabase/postgres:15.8.1.085
    environment: { POSTGRES_PASSWORD: postgres, POSTGRES_DB: postgres, JWT_SECRET: "${JWT_SECRET}" }
    ports: ["54322:5432"]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U postgres -h localhost"], interval: 3s, timeout: 3s, retries: 40 }
  auth:
    image: supabase/gotrue:v2.172.1
    depends_on: { db: { condition: service_healthy } }
    ports: ["9999:9999"]
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: "9999"
      API_EXTERNAL_URL: http://localhost:54321
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgres://supabase_auth_admin:postgres@db:5432/postgres
      GOTRUE_SITE_URL: http://localhost:3111
      GOTRUE_JWT_SECRET: "${JWT_SECRET}"
      GOTRUE_JWT_EXP: "3600"
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
      GOTRUE_JWT_ADMIN_ROLES: service_role
      GOTRUE_DISABLE_SIGNUP: "false"
      GOTRUE_EXTERNAL_EMAIL_ENABLED: "true"
      GOTRUE_MAILER_AUTOCONFIRM: "true"
  rest:
    image: postgrest/postgrest:v12.2.12
    depends_on: { db: { condition: service_healthy } }
    ports: ["3000:3000"]
    environment:
      PGRST_DB_URI: postgres://authenticator:postgres@db:5432/postgres
      PGRST_DB_SCHEMAS: public,storage
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: "${JWT_SECRET}"
  storage:
    image: supabase/storage-api:v1.19.3
    depends_on: { db: { condition: service_healthy }, rest: { condition: service_started } }
    ports: ["5000:5000"]
    environment:
      ANON_KEY: "${ANON_KEY}"
      SERVICE_KEY: "${SERVICE_KEY}"
      POSTGREST_URL: http://rest:3000
      PGRST_JWT_SECRET: "${JWT_SECRET}"
      DATABASE_URL: postgres://supabase_storage_admin:postgres@db:5432/postgres
      FILE_SIZE_LIMIT: "52428800"
      STORAGE_BACKEND: file
      FILE_STORAGE_BACKEND_PATH: /var/lib/storage
      TENANT_ID: local
      REGION: local
      GLOBAL_S3_BUCKET: local
      ENABLE_IMAGE_TRANSFORMATION: "false"
    volumes: ["storage-data:/var/lib/storage"]
volumes: { storage-data: {} }
